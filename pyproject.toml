[project]
name = "repo-pulse"
version = "3.0.0"
description = "Forecast monthly GitHub commit activity with a LoRA fine-tuned Chronos transformer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Naif Asswiel" }]

dependencies = [
    "gradio>=4.0,<5.0",
    "chronos-forecasting>=1.4.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "torch>=2.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
    "plotly>=5.18.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.1.0",
    "responses>=0.25.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]
training = [
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "tqdm>=4.65.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = ["slow: requires model download or GPU"]
